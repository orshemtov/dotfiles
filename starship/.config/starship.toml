# Minimal starship config for fast shell loading
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500

# Only show: directory, git_branch, character, cmd_duration
format = """
$directory\
$git_branch\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = '[➜](bold green)'

[directory]
truncation_length = 8
truncation_symbol = '…/'
truncate_to_repo = true

[git_branch]
symbol = '🌱 '
truncation_length = 12
truncation_symbol = ''
ignore_branches = ['master', 'main']

[cmd_duration]
min_time = 2000
format = '[$duration]($style) '
