theme = "catppuccin-mocha"
appearance = "system"
diff_view = "side-by-side"
ignore_whitespace = false
show_file_list = true
mouse = true
leader = ";"
comment_vim = false
relative_line_numbers = false
cursor_line = true
review_watch_interval_ms = 1000

comment_types = [
  { id = "issue", color = "red", definition = "must fix before merge" },
  { id = "suggestion", color = "yellow", definition = "possible improvement" },
  { id = "praise", color = "green", definition = "positive feedback" },
  { id = "nit", label = "nitpick", color = "#d19a66", definition = "small optional tweak" },
]

[forge]
comment_type_prefix = true